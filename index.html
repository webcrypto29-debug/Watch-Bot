<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            margin-top: 30px;
        }
        .btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>⏳ Please wait while the content loads...</h3>
        
        <!-- Onclicka Inpage / Banner Ad Script -->
        <script async src="https://js.onclckmn.com/static/onclicka.js" data-admpid="450452"></script>

        <br><br>
        <p>If you are not redirected automatically, click below:</p>
        <a id="goBtn" href="#" class="btn">Proceed to Destination 🚀</a>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        // URL se target link nikalna jo bot ne bheja tha
        const urlParams = new URLSearchParams(window.location.search);
        let targetUrl = urlParams.get('url');

        const btn = document.getElementById('goBtn');

        if (targetUrl) {
            btn.href = targetUrl;
            
            // Auto-redirect logic (Aap yahan timer bhi laga sakte hain taaki ad load hone ke baad redirect ho)
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 4000); // 4 seconds ke baad apne aap target website par bhej dega
        } else {
            btn.href = "https://google.com";
        }
    </script>
</body>
</html>
